<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Window Base Rounded Box -->
  <rect x="24" y="24" width="464" height="464" rx="80" fill="url(#bgGrad)" stroke="#334155" stroke-width="8" />
  
  <!-- Title bar dot indicators -->
  <circle cx="84" cy="84" r="12" fill="#ef4444" />
  <circle cx="124" cy="84" r="12" fill="#eab308" />
  <circle cx="164" cy="84" r="12" fill="#22c55e" />

  <!-- Terminal Prompt Symbol >_ -->
  <path d="M120 180 L220 270 L120 360" fill="none" stroke="url(#accentGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Cursor Line -->
  <line x1="260" y1="360" x2="380" y2="360" stroke="#38bdf8" stroke-width="32" stroke-linecap="round" filter="url(#glow)" />
  
  <!-- Key lock badge overlay in bottom corner -->
  <circle cx="390" cy="200" r="50" fill="#0284c7" />
  <circle cx="390" cy="200" r="42" fill="#0f172a" />
  <path d="M380 190 A10 10 0 0 1 400 190 L400 205 L380 205 Z" fill="none" stroke="#38bdf8" stroke-width="6" />
  <rect x="374" y="205" width="32" height="24" rx="4" fill="#38bdf8" />
</svg>
